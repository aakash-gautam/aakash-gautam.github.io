<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>IIT Mandi Recruitment Cell: VAST System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>
:root{
--navy:#0b2545;
--navy-dark:#061a31;
--navy-light:#173f6d;
--soft:#f4f7fb;
--soft2:#eaf0f7;
--text:#101828;
--muted:#667085;
--border:#dfe5ec;
--success:#12824c;
--danger:#b42318;
--radius:12px;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;background:#fff}
body{
min-height:100vh;
font-family:"Open Sans","Roboto",Arial,sans-serif;
color:var(--text);
-webkit-font-smoothing:antialiased;
}
button,input,select{font:inherit}
button{cursor:pointer}
.page{
width:100%;
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:24px 18px;
}
.container{
width:100%;
max-width:620px;
margin:auto;
}
.header{text-align:center;margin-bottom:30px}
.logo{
display:block;
width:150px;
height:150px;
object-fit:contain;
margin:0 auto 8px;
}
.header h1{
margin:0;
color:var(--navy-dark);
font-family:"Roboto","Open Sans",sans-serif;
font-size:24px;
line-height:1.25;
font-weight:700;
letter-spacing:-.4px;
}
.header p{
max-width:510px;
margin:10px auto 0;
color:var(--muted);
font-size:14px;
line-height:1.6;
}
.field-label{
display:block;
margin-bottom:8px;
color:#344054;
font-size:13px;
font-weight:600;
}
.input-row{
display:grid;
grid-template-columns:minmax(0,1fr) 54px;
gap:9px;
}
.application-input{
width:100%;
height:54px;
padding:0 15px;
background:#fff;
color:var(--navy-dark);
border:1px solid var(--border);
border-radius:var(--radius);
outline:none;
font-size:16px;
font-weight:600;
transition:border-color .15s ease;
}
.application-input::placeholder{color:#98a2b3;font-weight:400}
.application-input:focus{border-color:var(--navy)}
.qr-button{
width:54px;
height:54px;
padding:0;
display:flex;
align-items:center;
justify-content:center;
background:var(--soft);
color:var(--navy);
border:1px solid var(--border);
border-radius:var(--radius);
}
.qr-button:hover{background:var(--soft2)}
.qr-button svg{width:22px;height:22px}

.actions{
margin-top:14px;
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}
.button{
min-height:50px;
padding:0 18px;
display:flex;
align-items:center;
justify-content:center;
border-radius:var(--radius);
font-size:13px;
font-weight:700;
}
.button-primary{
background:var(--navy);
color:#fff;
border:1px solid var(--navy);
}
.button-primary:hover{background:var(--navy-light)}
.button-secondary{
background:#fff;
color:var(--navy);
border:1px solid #bcc8d6;
}
.button-secondary:hover{background:var(--soft)}
.seat-button{
grid-column:1/-1;
background:var(--soft);
color:var(--navy);
border:1px solid var(--border);
}
.seat-button:hover{background:var(--soft2)}
button:disabled{opacity:.55;cursor:not-allowed}

.seat-panel,.scanner{
display:none;
margin-top:16px;
border-radius:var(--radius);
}
.seat-panel.show,.scanner.show{display:block}

.seat-panel{
padding:17px;
border:1px solid var(--border);
}
.seat-panel-header{
margin-bottom:13px;
display:flex;
align-items:center;
justify-content:space-between;
}
.seat-panel-header strong{
font-size:14px;
color:var(--navy-dark);
}
.refresh-link{
width:34px;
height:34px;
padding:0;
display:flex;
align-items:center;
justify-content:center;
background:transparent;
border:0;
border-radius:8px;
color:var(--navy);
}
.refresh-link:hover{background:var(--soft)}
.refresh-link svg{width:19px;height:19px}

.venue-list{
display:grid;
gap:9px;
}
.venue-row{
padding:13px;
background:#fff;
border:1px solid #e7ebf0;
border-radius:10px;
}
.venue-main{
display:flex;
align-items:flex-start;
justify-content:space-between;
gap:15px;
}
.venue-info{min-width:0}
.venue-info strong{
display:block;
font-size:17px;
font-weight:700;
color:var(--navy-dark);
}
.venue-info span{
display:block;
margin-top:4px;
font-size:12px;
color:var(--muted);
}
.seat-count{
flex-shrink:0;
display:flex;
align-items:baseline;
gap:4px;
font-family:"Roboto","Open Sans",sans-serif;
}
.seat-count .remaining{
color:var(--success);
font-size:22px;
font-weight:700;
}
.seat-count .remaining.full{color:var(--danger)}
.seat-count .separator{
color:#111;
font-size:17px;
font-weight:600;
}
.seat-count .total{
color:#111;
font-size:18px;
font-weight:700;
}
.progress{
width:100%;
height:5px;
margin-top:11px;
overflow:hidden;
background:#e8edf3;
border-radius:999px;
}
.progress-fill{
height:100%;
background:var(--navy);
border-radius:999px;
transition:width .3s ease;
}
.pwd-tag{
display:inline-block;
margin-top:5px;
padding:2px 6px;
background:var(--soft);
color:var(--navy);
border-radius:5px;
font-size:10px;
font-weight:700;
}
.empty-message{
color:var(--muted);
font-size:13px;
padding:10px 0;
}

.scanner{
padding:12px;
border:1px solid var(--border);
}
#reader{
width:100%;
overflow:hidden;
border-radius:9px;
}
#reader video{border-radius:9px}
.scanner-text{
margin:10px 0 0;
font-size:11px;
color:var(--muted);
text-align:center;
}

.modal-overlay{
position:fixed;
inset:0;
z-index:9999;
display:none;
align-items:center;
justify-content:center;
padding:20px;
background:rgba(255,255,255,.76);
backdrop-filter:blur(3px);
-webkit-backdrop-filter:blur(3px);
}
.modal-overlay.show{display:flex}
.modal-box{
width:100%;
max-width:390px;
padding:32px 26px;
background:#fff;
border:1px solid #e1e6ec;
border-radius:16px;
text-align:center;
animation:modalIn .18s ease-out;
}
@keyframes modalIn{
from{opacity:0;transform:scale(.96)}
to{opacity:1;transform:scale(1)}
}
.spinner{
width:48px;
height:48px;
margin:0 auto 20px;
border:4px solid #e5eaf0;
border-top-color:var(--navy);
border-radius:50%;
animation:spin .75s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.modal-title{
margin:0;
font-family:"Roboto","Open Sans",sans-serif;
font-size:20px;
font-weight:700;
color:var(--navy-dark);
}
.modal-message{
margin:8px 0 0;
color:var(--muted);
font-size:13px;
line-height:1.5;
}
.modal-check{
width:56px;
height:56px;
margin:0 auto 17px;
display:flex;
align-items:center;
justify-content:center;
border-radius:50%;
background:#effaf4;
color:var(--success);
font-size:30px;
font-weight:700;
}
.modal-venue{
margin:18px 0 5px;
color:var(--success);
font-family:"Roboto","Open Sans",sans-serif;
font-size:32px;
font-weight:700;
}
.modal-applicant{
margin-top:11px;
color:#111;
font-family:"Roboto","Open Sans",sans-serif;
font-size:21px;
font-weight:700;
}
.modal-application-id{
margin-top:7px;
color:var(--navy);
font-family:"Roboto","Open Sans",sans-serif;
font-size:18px;
font-weight:700;
}
.modal-error-icon{
width:56px;
height:56px;
margin:0 auto 13px;
display:flex;
align-items:center;
justify-content:center;
border-radius:50%;
background:#f3f4f6;
color:#111;
font-size:28px;
font-weight:700;
}
.modal-error-title{
margin:0;
color:#111;
font-family:"Roboto","Open Sans",sans-serif;
font-size:28px;
font-weight:700;
}
.modal-existing-venue{
margin-top:16px;
color:var(--navy);
font-family:"Roboto","Open Sans",sans-serif;
font-size:20px;
font-weight:700;
}
.modal-close{
width:100%;
min-height:46px;
margin-top:22px;
background:var(--navy);
color:#fff;
border:1px solid var(--navy);
border-radius:10px;
font-size:13px;
font-weight:700;
}

.custom-modal-label{
display:block;
margin:22px 0 8px;
text-align:left;
font-size:13px;
font-weight:600;
color:#344054;
}
.custom-modal-select{
width:100%;
height:50px;
padding:0 13px;
background:#fff;
color:var(--navy-dark);
border:1px solid var(--border);
border-radius:10px;
outline:none;
}
.custom-modal-select:focus{border-color:var(--navy)}
.custom-modal-actions{
margin-top:14px;
display:grid;
grid-template-columns:1fr 1fr;
gap:9px;
}
.custom-cancel{
min-height:46px;
background:#fff;
color:var(--navy);
border:1px solid var(--border);
border-radius:10px;
font-size:13px;
font-weight:700;
}
.custom-confirm{
min-height:46px;
background:var(--navy);
color:#fff;
border:1px solid var(--navy);
border-radius:10px;
font-size:13px;
font-weight:700;
}

@media(max-width:520px){
.page{
min-height:100dvh;
padding:20px 16px;
align-items:center;
justify-content:center;
}
.container{margin:auto}
.header{margin-bottom:25px}
.header h1{font-size:23px}
.header p{font-size:13px}
.actions{grid-template-columns:1fr}
.seat-button{grid-column:auto}
.modal-box{
max-width:350px;
padding:28px 22px;
}
.modal-venue{font-size:28px}
}
</style>
</head>

<body>

<main class="page">
<div class="container">

<header class="header">
<img src="iitmdlogo.png" alt="IIT Mandi Logo" class="logo">
<h1>VAST System by Recruitment Cell, IIT Mandi</h1>
<p>Developed by Aakash Gautam, IIT Mandi</p>
</header>

<label for="applicationId" class="field-label">Application ID</label>

<div class="input-row">
<input
id="applicationId"
class="application-input"
type="text"
placeholder="Enter Application ID"
autocomplete="off"
autocapitalize="characters"
spellcheck="false"
>

<button id="qrButton" class="qr-button" type="button" title="Scan QR Code">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
<path d="M3 8V5a2 2 0 0 1 2-2h3"/>
<path d="M16 3h3a2 2 0 0 1 2 2v3"/>
<path d="M21 16v3a2 2 0 0 1-2 2h-3"/>
<path d="M8 21H5a2 2 0 0 1-2-2v-3"/>
<rect x="7" y="7" width="3" height="3"/>
<rect x="14" y="7" width="3" height="3"/>
<rect x="7" y="14" width="3" height="3"/>
<path d="M14 14h3v3"/>
</svg>
</button>
</div>

<div class="actions">
<button id="assignButton" type="button" class="button button-primary">
Assign Venue
</button>

<button id="customButton" type="button" class="button button-secondary">
Custom Assign Venue
</button>

<button id="seatMatrixButton" type="button" class="button seat-button">
Seat Matrix
</button>
</div>

<section id="scannerPanel" class="scanner">
<div id="reader"></div>
<p class="scanner-text">Position the applicant QR code inside the camera area.</p>
</section>

<section id="seatPanel" class="seat-panel">
<div class="seat-panel-header">

<strong>Seat Matrix</strong>

<button id="refreshButton" class="refresh-link" type="button" title="Refresh">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
<path d="M20 6v6h-6"/>
<path d="M4 18v-6h6"/>
<path d="M6.5 9a7 7 0 0 1 11.7-2.6L20 8"/>
<path d="M17.5 15a7 7 0 0 1-11.7 2.6L4 16"/>
</svg>
</button>

</div>

<div id="venueList" class="venue-list">
Loading...
</div>

</section>

</div>
</main>

<div id="modalOverlay" class="modal-overlay">
<div id="modalBox" class="modal-box"></div>
</div>

<script>
const WEB_APP_URL="https://script.google.com/macros/s/AKfycbxmStXxFpsmZ4H4VWFqSuP1efTiZv9JtXGc-IDP2Yf8sgWmQRS5a52UjpKjN6v3fn8acQ/exec";

const applicationInput=document.getElementById("applicationId");
const assignButton=document.getElementById("assignButton");
const customButton=document.getElementById("customButton");
const qrButton=document.getElementById("qrButton");
const seatMatrixButton=document.getElementById("seatMatrixButton");
const refreshButton=document.getElementById("refreshButton");
const seatPanel=document.getElementById("seatPanel");
const scannerPanel=document.getElementById("scannerPanel");
const venueList=document.getElementById("venueList");
const modalOverlay=document.getElementById("modalOverlay");
const modalBox=document.getElementById("modalBox");

let requestTimeout=null;
let qrScanner=null;
let scannerRunning=false;
let scanLocked=false;
let activeScripts={};
let availableVenues=[];

assignButton.addEventListener("click",function(){
const applicationId=normalizeApplicationId(applicationInput.value);

if(!applicationId){
showErrorModal(
"Application ID required",
"Please enter or scan the applicant's Application ID."
);
return;
}

applicationInput.value=applicationId;
assignVenue(applicationId,"autoAssign","");
});

customButton.addEventListener("click",function(){
const applicationId=normalizeApplicationId(applicationInput.value);

if(!applicationId){
showErrorModal(
"Application ID required",
"Enter the applicant's Application ID first."
);
return;
}

applicationInput.value=applicationId;

loadVenueData(function(){
showCustomAssignModal(applicationId);
});
});

seatMatrixButton.addEventListener("click",function(){
seatPanel.classList.toggle("show");
stopScanner();

if(seatPanel.classList.contains("show")){
loadVenueData();
}
});

refreshButton.addEventListener("click",function(){
loadVenueData();
});

function showCustomAssignModal(applicationId){

if(!availableVenues.length){
showErrorModal(
"No venues available",
"No general venue currently has an available seat."
);
return;
}

const options=availableVenues.map(function(venue){
return `
<option value="${escapeHtml(venue.venueId)}">
${escapeHtml(venue.venueName)} (${escapeHtml(venue.available)} available)
</option>`;
}).join("");

modalBox.innerHTML=`

<h2 class="modal-title">
Custom Assign Venue
</h2>

<p class="modal-message">
${escapeHtml(applicationId)}
</p>

<label class="custom-modal-label">
Select Venue
</label>

<select id="customVenueModalSelect" class="custom-modal-select">
<option value="">Select available venue</option>
${options}
</select>

<div class="custom-modal-actions">

<button
type="button"
class="custom-cancel"
onclick="closeModal()"
>
Cancel
</button>

<button
type="button"
class="custom-confirm"
onclick="confirmCustomAssignment()"
>
Assign Venue
</button>

</div>
`;

modalOverlay.classList.add("show");
}

function confirmCustomAssignment(){

const select=document.getElementById("customVenueModalSelect");

if(!select||!select.value){
return;
}

const applicationId=normalizeApplicationId(applicationInput.value);

modalOverlay.classList.remove("show");

assignVenue(
applicationId,
"customAssign",
select.value
);
}

function assignVenue(applicationId,mode,venueId){

const requestId=createRequestId();
const callbackName="vastAssignment_"+sanitizeCallbackId(requestId);

setBusy(true);
showLoadingModal(applicationId);

clearTimeout(requestTimeout);

window[callbackName]=function(response){

clearTimeout(requestTimeout);

cleanupJsonp(callbackName);
setBusy(false);

if(
!response||
response.source!=="recruitment-venue-system"||
response.type!=="registration"
){
showErrorModal(
"Invalid response",
"The server returned an invalid response."
);
return;
}

const result=response.result||{};

if(result.ok){

showSuccessModal(result);

applicationInput.value="";

if(seatPanel.classList.contains("show")){
loadVenueData();
}

return;
}

if(result.code==="DUPLICATE"){

showDuplicateModal(result);

return;
}

showServerError(result);
};

let url=
WEB_APP_URL+
"?action=assignVenue"+
"&mode="+encodeURIComponent(mode)+
"&applicationId="+encodeURIComponent(applicationId)+
"&requestId="+encodeURIComponent(requestId)+
"&callback="+encodeURIComponent(callbackName)+
"&_="+Date.now();

if(venueId){
url+="&venueId="+encodeURIComponent(venueId);
}

createJsonpScript(url,callbackName);

requestTimeout=setTimeout(function(){

cleanupJsonp(callbackName);
setBusy(false);

showErrorModal(
"No response",
"The server did not respond."
);

},35000);
}

function loadVenueData(done){

const requestId=createRequestId();
const callbackName="vastVenueData_"+sanitizeCallbackId(requestId);

window[callbackName]=function(response){

cleanupJsonp(callbackName);

if(
!response||
response.source!=="recruitment-venue-system"||
response.type!=="venueData"||
!response.result
){
venueList.innerHTML=
'<div class="empty-message">Venue information could not be loaded.</div>';
return;
}

if(response.result.ok===false){
venueList.innerHTML=
'<div class="empty-message">'+
escapeHtml(response.result.message||"Venue information could not be loaded.")+
'</div>';
return;
}

availableVenues=Array.isArray(response.result.availableVenues)
?response.result.availableVenues
:[];

renderVenueData(response.result);

if(typeof done==="function"){
done();
}
};

const url=
WEB_APP_URL+
"?action=getVenueData"+
"&requestId="+encodeURIComponent(requestId)+
"&callback="+encodeURIComponent(callbackName)+
"&_="+Date.now();

createJsonpScript(url,callbackName);
}

function renderVenueData(data){

const venues=Array.isArray(data.venues)
?data.venues
:[];

if(!venues.length){

venueList.innerHTML=
'<div class="empty-message">No venues found.</div>';

return;
}

venueList.innerHTML=venues.map(function(venue){

const remaining=Number(venue.available||0);
const total=Number(venue.totalSeats||0);
const allocated=Number(venue.allocated||0);

const remainingPercent=
total>0
?Math.max(0,Math.min(100,(remaining/total)*100))
:0;

return `
<div class="venue-row">

<div class="venue-main">

<div class="venue-info">

<strong>
${escapeHtml(venue.venueName)}
</strong>

<span>
${escapeHtml(allocated)} allotted
</span>

${venue.pwd?'<div class="pwd-tag">PWD</div>':""}

</div>

<div class="seat-count">

<span class="remaining ${remaining===0?"full":""}">
${escapeHtml(remaining)}
</span>

<span class="separator">/</span>

<span class="total">
${escapeHtml(total)}
</span>

</div>

</div>

<div class="progress">
<div
class="progress-fill"
style="width:${remainingPercent}%"
></div>
</div>

</div>`;
}).join("");
}

function createJsonpScript(url,callbackName){

const script=document.createElement("script");

script.src=url;
script.async=true;
script.id="jsonp_"+callbackName;

script.onerror=function(){

if(callbackName.startsWith("vastAssignment_")){

clearTimeout(requestTimeout);
setBusy(false);

showErrorModal(
"Connection error",
"The Apps Script Web App could not be reached."
);

}else{

venueList.innerHTML=
'<div class="empty-message">Venue information could not be loaded.</div>';

}

cleanupJsonp(callbackName);
};

activeScripts[callbackName]=script;

document.body.appendChild(script);
}

function cleanupJsonp(callbackName){

const script=
activeScripts[callbackName]||
document.getElementById("jsonp_"+callbackName);

if(script&&script.parentNode){
script.parentNode.removeChild(script);
}

delete activeScripts[callbackName];

try{
delete window[callbackName];
}catch(error){
window[callbackName]=undefined;
}
}

qrButton.addEventListener("click",async function(){

if(scannerRunning){
await stopScanner();
return;
}

seatPanel.classList.remove("show");

await startScanner();
});

async function startScanner(){

if(typeof Html5Qrcode==="undefined"){

showErrorModal(
"QR scanner unavailable",
"The QR scanner library could not be loaded."
);

return;
}

scannerPanel.classList.add("show");

try{

qrScanner=qrScanner||new Html5Qrcode("reader");

await qrScanner.start(

{facingMode:"environment"},

{
fps:10,
qrbox:function(width,height){

const size=Math.floor(Math.min(width,height)*.72);

return{
width:size,
height:size
};

}
},

async function(decodedText){

if(scanLocked){
return;
}

scanLocked=true;

const applicationId=
extractApplicationId(decodedText);

if(!applicationId){

scanLocked=false;

showErrorModal(
"Invalid QR code",
"An Application ID could not be detected."
);

return;
}

applicationInput.value=applicationId;

await stopScanner();

/* QR scan immediately triggers automatic assignment. */
setTimeout(function(){
assignButton.click();
},120);

},

function(){}

);

scannerRunning=true;

}catch(error){

scannerRunning=false;
scannerPanel.classList.remove("show");

showErrorModal(
"Camera unavailable",
"Camera access could not be started."
);
}
}

async function stopScanner(){

try{

if(qrScanner&&scannerRunning){
await qrScanner.stop();
}

}catch(error){

console.warn(error);

}finally{

scannerRunning=false;
scanLocked=false;
scannerPanel.classList.remove("show");

}
}

function showLoadingModal(applicationId){

modalBox.innerHTML=`

<div class="spinner"></div>

<h2 class="modal-title">
Assigning Venue
</h2>

<p class="modal-message">
Processing ${escapeHtml(applicationId)}. Please wait...
</p>
`;

modalOverlay.classList.add("show");
}

function showSuccessModal(result){

modalBox.innerHTML=`

<div class="modal-check">
✓
</div>

<h2 class="modal-title">
Venue Assigned Successfully
</h2>

<div class="modal-venue">
${escapeHtml(result.venueName||result.venueId)}
</div>

<div class="modal-applicant">
${escapeHtml(result.applicantName||"")}
</div>

<div class="modal-application-id">
${escapeHtml(result.applicationId||"")}
</div>

<button
type="button"
class="modal-close"
onclick="closeModal()"
>
Done
</button>
`;

modalOverlay.classList.add("show");
}

function showDuplicateModal(result){

modalBox.innerHTML=`

<div class="modal-error-icon">
!
</div>

<div class="modal-error-title">
Already Assigned
</div>

<p class="modal-message">
This applicant has already been allotted an examination venue.
</p>

${result.venueName||result.venueId
?`<div class="modal-existing-venue">${escapeHtml(result.venueName||result.venueId)}</div>`
:""}

<div class="modal-applicant">
${escapeHtml(result.applicantName||"")}
</div>

<div class="modal-application-id">
${escapeHtml(result.applicationId||"")}
</div>

<button
type="button"
class="modal-close"
onclick="closeModal()"
>
Close
</button>
`;

modalOverlay.classList.add("show");
}

function showErrorModal(title,message){

modalBox.innerHTML=`

<div class="modal-error-icon">
!
</div>

<h2 class="modal-title">
${escapeHtml(title)}
</h2>

<p class="modal-message">
${escapeHtml(message)}
</p>

<button
type="button"
class="modal-close"
onclick="closeModal()"
>
Close
</button>
`;

modalOverlay.classList.add("show");
}

function closeModal(){

modalOverlay.classList.remove("show");

setTimeout(function(){
applicationInput.focus();
},50);
}

function showServerError(result){

let title="Venue assignment failed";

if(result.code==="NOT_FOUND")title="Applicant not found";
if(result.code==="NO_SEATS")title="No seats available";
if(result.code==="VENUE_FULL"){
title="Selected venue is full";
loadVenueData();
}
if(result.code==="BUSY")title="System busy";
if(result.code==="PWD_VENUE")title="PWD reserved venue";
if(result.code==="INVALID_VENUE")title="Invalid venue";
if(result.code==="CONFIG_ERROR")title="Configuration error";
if(result.code==="INVALID_ID")title="Invalid Application ID";

showErrorModal(
title,
result.message||"The venue could not be assigned."
);
}

function setBusy(active){

assignButton.disabled=active;
customButton.disabled=active;
qrButton.disabled=active;
seatMatrixButton.disabled=active;
applicationInput.readOnly=active;

assignButton.textContent=
active
?"Processing..."
:"Assign Venue";
}

function extractApplicationId(value){

const text=String(value||"").trim();

if(!text)return"";

try{

const url=new URL(text);

const id=
url.searchParams.get("applicationId")||
url.searchParams.get("appId")||
url.searchParams.get("id");

if(id){
return normalizeApplicationId(id);
}

}catch(error){}

return normalizeApplicationId(text);
}

function normalizeApplicationId(value){

return String(value||"")
.trim()
.toUpperCase();
}

function createRequestId(){

if(
window.crypto&&
typeof crypto.randomUUID==="function"
){
return crypto.randomUUID();
}

return(
Date.now().toString(36)+
"-"+
Math.random().toString(36).substring(2,11)
);
}

function sanitizeCallbackId(value){

return String(value)
.replace(/[^A-Za-z0-9_$]/g,"_");
}

function escapeHtml(value){

return String(value??"")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");
}

applicationInput.addEventListener("keydown",function(event){

if(event.key==="Enter"){

event.preventDefault();

if(!assignButton.disabled){
assignButton.click();
}

}
});

window.addEventListener("load",function(){
applicationInput.focus();
});
</script>

</body>
</html>
